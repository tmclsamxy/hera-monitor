<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Hera Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Cpath d='M8 20l4-9 4 6 3-4 5 7' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand-lg">
      <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <path d="M8 20l4-9 4 6 3-4 5 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Hera Monitor</h1>
        <p>轻量服务器监控面板</p>
      </div>
    </div>
    <label class="field">
      <span>管理员密码</span>
      <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登 录</button>
    <p class="hint" id="loginHint">首次部署的初始密码见服务端终端输出或 <code>data/initial-password.txt</code></p>
  </form>
</div>

<!-- 主体 -->
<div class="layout hidden" id="appView">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <path d="M8 20l4-9 4 6 3-4 5 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Hera</span>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-route="overview" href="#/overview">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>概览</span>
      </a>
      <a class="nav-item" data-route="monitors" href="#/monitors">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
        <span>站点监控</span>
      </a>
      <a class="nav-item" data-route="alerts" href="#/alerts">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span>告警</span>
      </a>
      <a class="nav-item" data-route="settings" href="#/settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15a2 2 0 010-4 1.7 1.7 0 001.4-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0011 4.6a2 2 0 014 0 1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11a2 2 0 010 4z"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" title="退出登录">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" title="菜单">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h2 id="pageTitle">概览</h2>
      <div class="topbar-right">
        <span class="live-dot" id="liveDot" title="实时连接状态"></span>
        <span class="muted small" id="liveText">连接中…</span>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="/app.js"></script>
</body>
</html>
