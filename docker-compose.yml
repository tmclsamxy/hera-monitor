# ============================================================
#  Hera Monitor —— Docker 部署（推荐方式）
#
#    docker compose up -d            启动
#    docker compose logs -f          看日志（首次启动会打印管理员初始密码）
#    docker compose down             停止
#    docker compose pull && docker compose up -d   升级
#
#  改端口：复制 .env.example 为 .env，改 HERA_PORT
# ============================================================

services:
  hera-monitor:
    # 默认从当前源码构建，不依赖任何镜像仓库（国内网络更友好）
    build: .
    image: hera-monitor:latest
    # 想直接用预构建镜像（免构建），把上面的 build 注释掉、启用下面一行：
    # image: ghcr.io/tmclsamxy/hera-monitor:latest

    container_name: hera-monitor
    restart: unless-stopped

    # 让容器内 PID 1 正确处理信号，docker stop 能优雅退出并落盘数据
    init: true

    ports:
      # 宿主机:容器。绑 0.0.0.0 才能被外部访问；
      # 若前面还有 Nginx 反代，想只允许本机访问就改成 "127.0.0.1:8080:8080"
      - "${HERA_BIND:-0.0.0.0}:${HERA_PORT:-8080}:8080"

    environment:
      # 容器内必须监听所有网卡，否则端口映射进不来
      HERA_HOST: 0.0.0.0
      HERA_PORT: 8080
      HERA_DATA_DIR: /data
      # 面板生成 Agent 一键安装命令时用到的仓库地址
      HERA_REPO: tmclsamxy/hera-monitor
      # 走域名反代时填上，一键安装命令会自动使用该地址
      # HERA_PUBLIC_URL: https://monitor.example.com
      TZ: Asia/Shanghai

    volumes:
      - hera-data:/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 限制日志体积，避免长期运行把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hera-data:
    driver: local
