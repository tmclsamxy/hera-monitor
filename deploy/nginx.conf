# Hera Monitor 反向代理示例（Nginx）
#
# 放到 /etc/nginx/conf.d/hera-monitor.conf，然后 nginx -t && systemctl reload nginx
#
# ⚠️ 关键点：面板使用 SSE（Server-Sent Events）做实时推送，
#    必须关闭 proxy_buffering，否则页面数据不会实时刷新。

upstream hera_monitor {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS 跳转（不需要 HTTPS 时可删掉这一段）
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 面板体积很小，压缩收益一般，但开着无妨
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # 允许被测服务器上报的数据包大小（Agent 上报 JSON 通常 < 10KB）
    client_max_body_size 1m;

    # SSE 长连接需要放宽超时
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://hera_monitor;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # —— SSE 必备 ——
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 实时推送端点单独放宽
    location /api/stream {
        proxy_pass http://hera_monitor;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
